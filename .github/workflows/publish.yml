name: Publish iOS SDK (SPM & CocoaPods)

# Phase 1 native core. Publish this before RN, Flutter, and TaqlynNavSwiftUI.
# SPM is Git-tag based (no secrets). CocoaPods Trunk runs when COCOAPODS_TRUNK_TOKEN is set.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-spm:
    name: Verify Swift Package (SPM)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Package.swift Manifest
        run: swift package dump-package > /dev/null

      - name: Run SPM Tests
        run: swift test --enable-code-coverage

      - name: Verify Privacy Manifest
        run: |
          if [ ! -f "Sources/TaqlynSDK/PrivacyInfo.xcprivacy" ]; then
            echo "::error::Apple Required Reason PrivacyInfo.xcprivacy is missing!"
            exit 1
          fi
          echo "Privacy manifest verified."

  publish-cocoapods:
    name: Publish to CocoaPods Trunk
    needs: publish-spm
    runs-on: macos-14
    environment:
      name: cocoapods
      url: https://cocoapods.org/pods/TaqlynSDK
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Podspec
        run: pod ipc spec TaqlynSDK.podspec > /dev/null

      - name: Skip CocoaPods Trunk
        if: env.COCOAPODS_TRUNK_TOKEN == ''
        run: echo "COCOAPODS_TRUNK_TOKEN is not set; skipping Trunk publish. SPM still works from the Git tag."

      - name: Push to CocoaPods Trunk
        if: env.COCOAPODS_TRUNK_TOKEN != ''
        run: pod trunk push TaqlynSDK.podspec --allow-warnings
